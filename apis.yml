name: SpartanNash
description: >-
  SpartanNash is a Byron Center, Michigan food solutions company that operates as
  both a wholesale grocery distributor and a retail grocer. Its wholesale segment
  supplies roughly 2,100 independent retail locations, national accounts and
  e-commerce partners from a network of distribution centers, and through its MDV
  business it is the leading distributor of grocery products to United States
  military commissaries and exchanges worldwide. Its retail segment operates
  roughly 200 corporate-owned supermarkets under banners including Family Fare,
  Martin's Super Markets, D&W Fresh Market, VG's Grocery, Dan's Supermarket,
  Family Fresh Market, Needler's Fresh Market, Fresh City Market, Forest Hills
  Foods and Supermercado Nuestra Familia, alongside pharmacy and fuel centers.
  Formed by the 2013 merger of Spartan Stores and Nash Finch, the company traded
  on Nasdaq as SPTN until C&S Wholesale Grocers completed its acquisition of
  SpartanNash on September 22, 2025; SpartanNash now operates as part of C&S and
  its corporate web properties are progressively being folded into cswg.com.
  SpartanNash publishes no public developer program, API documentation or
  machine-readable API contract; supplier and customer system integration is
  transacted over EDI through trading-partner onboarding rather than a public API.
